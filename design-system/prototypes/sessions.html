<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("archcode-prototype-theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ArchCode project Sessions prototype" />
    <title>ArchCode — Sessions Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=prototype-polish-16" />
    <style>
      [hidden] { display: none !important; }

      .sessions-route {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        background: var(--bg-base);
      }

      .sessions-commandbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        min-height: 58px;
        padding: 10px 24px;
        border-bottom: 1px solid var(--border-default);
        background: var(--bg-surface);
      }

      .sessions-commandbar .surface-filter {
        flex: 0 1 420px;
      }

      .sessions-source-picker {
        position: relative;
        flex: 0 0 142px;
        width: 142px;
      }

      .sessions-source-trigger {
        display: grid;
        grid-template-columns: 15px minmax(0, 1fr) 12px;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 36px;
        padding: 0 11px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--bg-base);
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 650;
        text-align: left;
        transition:
          border-color var(--motion-hover) ease,
          background var(--motion-hover) ease,
          box-shadow var(--motion-hover) ease;
      }

      .sessions-source-trigger:hover {
        border-color: var(--border-default);
        background: var(--bg-elevated);
      }

      .sessions-source-trigger:focus-visible,
      .sessions-source-trigger[aria-expanded="true"] {
        border-color: var(--brand);
        background: var(--bg-elevated);
        box-shadow: var(--focus);
      }

      .sessions-source-trigger [data-icon] svg {
        width: 14px;
        height: 14px;
      }

      .sessions-source-trigger[aria-expanded="true"] > [data-icon="filter"] { color: var(--brand); }

      .sessions-source-value {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sessions-source-chevron {
        display: grid;
        place-items: center;
        pointer-events: none;
        transform: rotate(90deg);
        transition: transform var(--motion-icon) var(--ease-standard);
      }

      .sessions-source-trigger[aria-expanded="true"] .sessions-source-chevron { transform: rotate(-90deg); }

      .sessions-source-menu {
        position: absolute;
        z-index: 30;
        top: calc(100% + 6px);
        left: 0;
        width: min(220px, calc(100vw - 24px));
        padding: 6px;
        border: 1px solid var(--border-default);
        border-radius: 8px;
        background: var(--bg-overlay);
        box-shadow: var(--elevation-md);
      }

      .sessions-source-menu-header {
        padding: 6px 10px 8px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .sessions-source-menu-header strong,
      .sessions-source-menu-header span { display: block; }

      .sessions-source-menu-header strong { font-size: 11px; font-weight: 680; }

      .sessions-source-menu-header span {
        margin-top: 2px;
        color: var(--text-tertiary);
        font-size: 10px;
        line-height: 16px;
      }

      .sessions-source-options { padding-top: 4px; }

      .sessions-source-option {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 14px;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 6px 8px;
        border-radius: 4px;
        background: transparent;
        color: var(--text-secondary);
        text-align: left;
      }

      .sessions-source-option:hover,
      .sessions-source-option:focus-visible { background: var(--bg-hover); color: var(--text-primary); }

      .sessions-source-option > [data-icon] { color: var(--text-muted); }
      .sessions-source-option[aria-checked="true"] > [data-icon] { color: var(--brand); }
      .sessions-source-option-copy strong,
      .sessions-source-option-copy span { display: block; }
      .sessions-source-option-copy strong { font-size: 12px; font-weight: 650; }
      .sessions-source-option-copy span { margin-top: 1px; color: var(--text-tertiary); font-size: 10px; line-height: 16px; }
      .sessions-source-check { display: grid; place-items: center; color: var(--brand); }
      .sessions-source-option[aria-checked="false"] .sessions-source-check { visibility: hidden; }

      /* new-session uses shared .primary-button; keep layout pull only */
      .sessions-commandbar .primary-button { margin-left: auto; }

      .sessions-scroll {
        min-height: 0;
        overflow: auto;
      }

      .sessions-inner {
        width: min(100%, 1080px);
        margin: 0 auto;
        padding: 24px 24px 56px;
      }

      .session-group + .session-group { margin-top: 28px; }

      .session-group-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        min-height: 28px;
        padding: 0 3px 8px;
      }

      .session-group-header h2 {
        font-size: 11px;
        font-weight: 720;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .session-group-header span {
        color: var(--text-tertiary);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      .session-rows { border-top: 1px solid var(--border-default); }

      .session-row {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        min-height: 60px;
        padding: 12px;
        border-bottom: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        transition:
          background var(--motion-hover) var(--ease-smooth),
          color var(--motion-hover) var(--ease-smooth),
          box-shadow var(--motion-hover) var(--ease-smooth),
          transform var(--motion-hover) var(--ease-smooth);
      }

      .session-row:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }

      .session-row:active {
        transform: translateY(0) scale(0.995);
      }

      /* session-orbit tones come from shared styles.css */

      .session-row-copy { min-width: 0; }

      .session-row-copy strong,
      .session-row-copy small { display: block; }

      .session-row-copy strong {
        overflow: hidden;
        color: var(--text-primary);
        font-size: 13.5px;
        font-weight: 620;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-row-copy small {
        margin-top: 3px;
        overflow: hidden;
        color: var(--text-tertiary);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-source-label {
        display: inline-flex;
        align-items: center;
        margin-right: 4px;
        color: var(--text-tertiary);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: 0;
      }

      .session-row-state {
        justify-self: end;
        color: var(--text-tertiary);
        font-size: 11px;
        font-weight: 640;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .session-row-state.attention { color: var(--warning); font-weight: 680; }
      .session-row-state.running { color: var(--signal-foreground); }
      .session-row-state.done { color: var(--success); }
      .session-row-state.failed { color: var(--error); font-weight: 680; }

      .sessions-empty {
        display: grid;
        place-items: center;
        min-height: 260px;
        padding: 40px 16px;
        color: var(--text-tertiary);
        text-align: center;
      }

      .sessions-empty-icon {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--brand) 8%, var(--bg-surface));
        color: var(--brand);
      }

      .sessions-empty-icon [data-icon] {
        font-size: 24px;
      }

      .sessions-empty strong,
      .sessions-empty span { display: block; }
      .sessions-empty strong { color: var(--text-secondary); font-size: 13px; }
      .sessions-empty span { margin-top: 6px; font-size: 11px; }

      @media (max-width: 760px) {
        .sessions-commandbar {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px;
          padding: 10px 12px 12px;
        }

        .sessions-commandbar .surface-filter { grid-column: 1 / -1; }
        .sessions-source-trigger,
        .sessions-commandbar .primary-button { min-height: 44px; }
        .sessions-source-picker { width: 150px; }
        .sessions-commandbar .primary-button { margin-left: 0; }
        .sessions-inner { padding: 18px 12px 40px; }
        .session-row { min-height: 74px; padding-right: 6px; padding-left: 6px; }
      }

      @media (max-width: 520px) {
        .session-row {
          grid-template-columns: 14px minmax(0, 1fr);
        }

        .session-row-state {
          grid-column: 2;
          justify-self: start;
          margin-top: -3px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        /* shared status-orbit reduced-motion lives in styles.css */
      }
    </style>
    <script src="./app.js?v=prototype-polish-16" defer></script>
  </head>
  <body class="sessions-page todo-first-shell">
    <a class="skip-link" href="#work-canvas">Skip to work canvas</a>
    <div class="app-shell">
      <nav class="project-rail" aria-label="Projects">
        <a class="brand-mark" href="./dashboard.html" aria-label="Open Home"><img src="./logo.svg" alt="" width="20" height="20" /></a>
        <a class="rail-project active" href="./todos.html" aria-label="Open archcode Todos" aria-current="page">ar</a>
        <button type="button" class="rail-project" aria-label="Open archcode-readme-demo-workspace" data-action="Open archcode-readme-demo-workspace Todos">ar</button>
        <button type="button" class="rail-project" aria-label="Open specra-test-projects" data-action="Open specra-test-projects Todos">sp</button>
        <button type="button" class="rail-icon" aria-label="Open project" title="Open project" data-action="Open project" data-icon="plus"></button>
        <div class="rail-spacer"></div>
        <div class="rail-separator" aria-hidden="true"></div>
        <button type="button" class="rail-icon rail-search" aria-label="Search all work" title="Search all work" aria-keyshortcuts="Meta+K Control+K" data-open-global-search data-icon="search"></button>
        <button type="button" class="rail-icon" aria-label="Open 3 requests needing attention" title="Needs you" data-open-attention><span data-icon="bell"></span><span class="rail-attention-count">3</span></button>
        <button type="button" class="rail-icon" aria-label="Settings" title="Settings" data-action="Open settings" data-icon="settings"></button>

      </nav>

      <main class="work-canvas" id="work-canvas" aria-label="Work canvas" tabindex="-1">
        <header class="project-toolbar">
          <div class="project-identity">
            <span class="project-identity-mark">ar</span>
            <div class="project-identity-copy"><h1>ArchCode</h1><span>/workspace/archcode</span></div>
          </div>
          <nav class="project-toolbar-nav" aria-label="Project pages">
            <a href="./todos.html"><span>Todos</span></a>

            </div>
            <div class="sessions-source-picker">
              <button class="sessions-source-trigger" type="button" aria-label="Session source: All sources" aria-haspopup="menu" aria-expanded="false" data-session-source-trigger data-value="all">
                <span data-icon="filter"></span>
                <span class="sessions-source-value" data-session-source-value>All sources</span>

              </button>
              <div class="sessions-source-menu" role="menu" aria-label="Session source" hidden data-session-source-menu>
                <div class="sessions-source-menu-header"><strong>Session source</strong><span>Narrow Sessions by how they started.</span></div>
                <div class="sessions-source-options">
                  <button class="sessions-source-option" type="button" role="menuitemradio" aria-checked="true" data-source-value="all"><span data-icon="layers"></span><span class="sessions-source-option-copy"><strong>All sources</strong><span>Every Session origin</span></span><span class="sessions-source-check" data-icon="check"></span></button>
                  <button class="sessions-source-option" type="button" role="menuitemradio" aria-checked="false" data-source-value="todo"><span data-icon="todo"></span><span class="sessions-source-option-copy"><strong>Todo</strong><span>Started from a Todo</span></span><span class="sessions-source-check" data-icon="check"></span></button>
                  <button class="sessions-source-option" type="button" role="menuitemradio" aria-checked="false" data-source-value="automation"><span data-icon="workflow"></span><span class="sessions-source-option-copy"><strong>Automation</strong><span>Started by Automation</span></span><span class="sessions-source-check" data-icon="check"></span></button>
                  <button class="sessions-source-option" type="button" role="menuitemradio" aria-checked="false" data-source-value="direct"><span data-icon="app"></span><span class="sessions-source-option-copy"><strong>Direct</strong><span>Started directly</span></span><span class="sessions-source-check" data-icon="check"></span></button>

          <div class="sessions-scroll">

              <div class="sessions-empty-icon"><span data-icon="search"></span></div>
              <p><strong>No Sessions match this filter.</strong><span>Try another title, parent name, or source.</span></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>

    <script>
      const staticSessions = (window.archcodePrototypeStaticSessions || [
        { group: "Needs you", tone: "attention", state: "Needs you", source: "Todo", title: "Implementation Session", sessionId: "sess-profile-implementation", parent: "Model profile defaults per project", agent: "Lead → Build", href: "./session.html?todo=todo-profile-defaults&session=sess-profile-implementation&state=hitl" },
        { group: "Needs you", tone: "failed", state: "Failed", source: "Automation", title: "Daily project health check", sessionId: "sess-aut-health-failed", parent: "Daily project health check", agent: "Lead", href: "./session.html?automation=aut-health&session=sess-aut-health-failed&title=Daily%20project%20health%20check" },
        { group: "Needs you", tone: "attention", state: "Needs you", source: "Todo", title: "Review recoverable worktree cleanup", sessionId: "sess-worktree-permission", parent: "Review recoverable worktree cleanup", agent: "Lead", href: "./session.html?todo=todo-worktree-permission&session=sess-worktree-permission" },
        { group: "Running", tone: "running", state: "12m", source: "Todo", title: "Live execution recovery", sessionId: "sess-live-recovery", parent: "Live execution recovery", agent: "Lead → Explore", href: "./session.html?todo=todo-live-recovery&session=sess-live-recovery" },
        { group: "Running", tone: "running", state: "34s", source: "Direct", title: "Fix incorrect model type", sessionId: "sess-direct-model-type", parent: "Lead", agent: "Lead", href: "./session.html?session=sess-direct-model-type&title=Fix%20incorrect%20model%20type" },
        { group: "Recent", tone: "done", state: "Completed · 1h", source: "Todo", title: "Review Session", sessionId: "sess-profile-review", parent: "Model profile defaults per project", agent: "Analyst", href: "./session.html?todo=todo-profile-defaults&session=sess-profile-review" },
        { group: "Recent", tone: "done", state: "Completed · Yesterday", source: "Automation", title: "Regression check · Aug 1", sessionId: "sess-aut-regression-20260801", parent: "Regression check", agent: "Lead", href: "./session.html?automation=aut-regression&session=sess-aut-regression-20260801&title=Regression%20check" },
        { group: "Recent", tone: "done", state: "Completed · Jul 30", source: "Direct", title: "Audit project context loading", sessionId: "sess-legacy-context-audit", parent: "Lead", agent: "Lead", href: "./session.html?session=sess-legacy-context-audit" },
      ]).map((item) => ({ ...item }));

      const groupOrder = ["Needs you", "Running", "Recent"];
      const groupsRoot = document.querySelector("[data-session-groups]");
      const emptyState = document.querySelector("[data-sessions-empty]");
      const searchInput = document.querySelector("[data-session-search]");
      const sourceTrigger = document.querySelector("[data-session-source-trigger]");
      const sourceValue = document.querySelector("[data-session-source-value]");
      const sourceMenu = document.querySelector("[data-session-source-menu]");
      const sourceOptions = [...document.querySelectorAll("[data-source-value]")];

      function escapeSessionsHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
      }

      function storedSessions() {
        const records = window.readArchcodePrototypeSessions?.() || [];
        return records.map((record) => {
          const href = record.href || `./session.html?session=${encodeURIComponent(record.sessionId)}&title=${encodeURIComponent(record.title || "Untitled Session")}`;
          const source = record.source || (record.automationId || href.includes("automation=") ? "Automation" : record.todoId || href.includes("todo=") ? "Todo" : "Direct");
          const sourceMeta = String(record.meta || "").replace(/^(Todo|Automation|Direct) · /, "");
          return {
            group: record.group || "Running",
            tone: record.tone || "running",
            state: record.state === "Running" ? "Started now" : record.state || "Running",
            source,
            title: record.title || "Untitled Session",
            sessionId: record.sessionId,
            parent: record.parent || sourceMeta || (source === "Todo" ? "Started with Run now" : source === "Automation" ? "Manual invocation" : "Lead"),
            agent: record.agent || "Lead",
            href,
          };
        });
      }

      function sessionItems() {
        const dynamic = storedSessions();
        const dynamicIds = new Set(dynamic.map((item) => item.sessionId));
        return [...dynamic, ...staticSessions.filter((item) => !dynamicIds.has(item.sessionId))];
      }

      function sourceContext(item) {
        return item.source === "Direct" ? item.parent || item.agent || "Lead" : `${item.parent} · ${item.agent}`;
      }

      function renderSessions() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedSource = sourceTrigger.dataset.value;
        const matches = sessionItems().filter((item) => {
          const matchesSource = selectedSource === "all" || item.source.toLowerCase() === selectedSource;
          const haystack = `${item.title} ${item.source} ${item.parent} ${item.agent}`.toLowerCase();
          return matchesSource && (!query || haystack.includes(query));
        });

        groupsRoot.innerHTML = groupOrder.map((group) => {
          const items = matches.filter((item) => item.group === group);
          if (!items.length) return "";
          return `<section class="session-group" aria-labelledby="sessions-${group.toLowerCase().replaceAll(" ", "-")}">
            <header class="session-group-header"><h2 id="sessions-${group.toLowerCase().replaceAll(" ", "-")}">${group}</h2><span>${items.length}</span></header>
            <div class="session-rows">${items.map((item) => `<a class="session-row" href="${escapeSessionsHtml(item.href)}" aria-label="${escapeSessionsHtml(`${item.title}, ${item.source}, ${item.state}`)}">
              <span class="session-orbit ${escapeSessionsHtml(item.tone)}"></span>
              <span class="session-row-copy"><strong>${escapeSessionsHtml(item.title)}</strong><small><span class="session-source-label">${escapeSessionsHtml(item.source)}</span>${escapeSessionsHtml(sourceContext(item))}</small></span>
              <span class="session-row-state ${escapeSessionsHtml(item.tone)}">${escapeSessionsHtml(item.state)}</span>
            </a>`).join("")}</div>
          </section>`;
        }).join("");

        groupsRoot.hidden = matches.length === 0;
        emptyState.hidden = matches.length !== 0;
      }

      searchInput.addEventListener("input", renderSessions);

      function setSourceMenuOpen(open, { focusSelected = false } = {}) {
        sourceMenu.hidden = !open;
        sourceTrigger.setAttribute("aria-expanded", String(open));
        if (open && focusSelected) {
          const selected = sourceOptions.find((option) => option.getAttribute("aria-checked") === "true") || sourceOptions[0];
          requestAnimationFrame(() => selected.focus());
        }
      }

      function selectSource(option) {
        const value = option.dataset.sourceValue;
        const label = option.querySelector("strong").textContent;
        sourceTrigger.dataset.value = value;
        sourceTrigger.setAttribute("aria-label", `Session source: ${label}`);
        sourceValue.textContent = label;
        sourceOptions.forEach((candidate) => candidate.setAttribute("aria-checked", String(candidate === option)));
        setSourceMenuOpen(false);
        renderSessions();
        sourceTrigger.focus();
      }

      sourceTrigger.addEventListener("click", () => setSourceMenuOpen(sourceMenu.hidden));
      sourceTrigger.addEventListener("keydown", (event) => {
        if (!["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) return;
        event.preventDefault();
        setSourceMenuOpen(true, { focusSelected: true });
      });
      sourceOptions.forEach((option) => option.addEventListener("click", () => selectSource(option)));
      sourceMenu.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          setSourceMenuOpen(false);
          sourceTrigger.focus();
          return;
        }
        if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const current = sourceOptions.indexOf(document.activeElement);
        const next = event.key === "Home"
          ? 0
          : event.key === "End"
            ? sourceOptions.length - 1
            : event.key === "ArrowDown"
              ? (current + 1) % sourceOptions.length
              : (current - 1 + sourceOptions.length) % sourceOptions.length;
        sourceOptions[next].focus();
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".sessions-source-picker")) setSourceMenuOpen(false);
      });

      document.querySelector("[data-new-session]").addEventListener("click", () => {
        const sessionId = `sess-direct-${Date.now()}`;
        const title = "Untitled Session";
        const href = `./session.html?session=${encodeURIComponent(sessionId)}&title=${encodeURIComponent(title)}&compose=1`;
        const records = window.readArchcodePrototypeSessions?.() || [];
        records.unshift({ group: "Recent", tone: "", state: "Idle", source: "Direct", title, sessionId, parent: "Lead", agent: "Lead", href });
        localStorage.setItem("archcode-prototype-sessions", JSON.stringify(records.slice(0, 12)));
        location.href = href;
      });

      renderSessions();
    </script>
  </body>
</html>
