<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open a project · ArchCode</title>
  <link rel="stylesheet" href="./styles.css?v=signal-polish-3">
</head>
<body class="page-project-empty">
  <div class="app-shell">
    <nav class="project-rail" aria-label="Application">
      <span class="rail-home rail-brand-static" aria-label="ArchCode"><img src="./logo.svg" alt="" width="20" height="20"></span>
      <button class="rail-action rail-open-project" type="button" aria-label="Open project" aria-haspopup="dialog" data-open-project><span data-icon="plus"></span></button>
      <div class="rail-spacer"></div>
      <button class="rail-action" type="button" aria-label="Settings" aria-haspopup="dialog" data-open-settings><span data-icon="settings"></span></button>
      <button class="rail-action" type="button" data-theme-toggle aria-label="Toggle theme"><span data-icon="sun"></span></button>
    </nav>

    <main class="work-canvas" id="work-canvas" tabindex="-1">
      <section class="project-empty-state" aria-labelledby="project-empty-title">
        <div class="project-empty-mark" aria-hidden="true"><img src="./logo.svg" alt="" width="28" height="28"></div>
        <span class="section-kicker">Self-hosted workbench</span>
        <h1 id="project-empty-title">Open a project to begin</h1>
        <p>Register an existing workspace. ArchCode will open its Todo workspace without creating, cloning, or moving the directory.</p>
        <button class="primary-button project-empty-action" type="button" aria-haspopup="dialog" data-open-project><span data-icon="plus"></span> Open project</button>
        <ul class="project-empty-facts" aria-label="Project registration facts">
          <li><span data-icon="check"></span><span>Your source and Git history stay in place</span></li>
          <li><span data-icon="check"></span><span>Runtime data remains local and self-hosted</span></li>
        </ul>
      </section>
    </main>
  </div>
  <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js?v=signal-polish-3"></script>
</body>
</html>
